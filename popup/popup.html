<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Research Reading Assistant</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <h1>Research Reading Assistant</h1>
      <p class="status" id="status">Checking page...</p>
    </header>

    <main class="content">
      <button id="run-detect" class="primary" disabled>RUN DETECT</button>

      <section class="structure">
        <h2>Paper structure</h2>
        <p id="structure-empty" class="empty">
          No cached data for this page yet. Click RUN DETECT to extract it.
        </p>
        <ul id="structure-list" class="structure-list" hidden></ul>
      </section>
    </main>

    <footer class="footer">
      <p>Results are logged to the page console (F12 &gt; Console).</p>
    </footer>

    <script src="../storage/papers.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
